[project]
name = "sentinel-logs"
version = "0.1.0"
description = "Mini-SIEM defensivo en Python: análisis de logs SSH/Nginx con reglas YAML, correlación por subred /24, detección de anomalías y Dashboard SOC."
readme = "README.md"
authors = [
    { name = "David Garcia Garcia", email = "davidgarcia20.academico@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentinel = "sentinel_logs.main:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
